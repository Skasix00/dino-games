name: dino-games

x-service: &service
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: '3'

services:
  app:
    <<: *service
    image: ghcr.io/skasix00/dino-games:${IMAGE_TAG:-production}
    command: [sh, -c, 'node seed.mjs && exec node server.js']
    environment:
      APP_ORIGIN: https://${PUBLIC_DOMAIN:-brunocastelo.me}
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:-brunocastelo.me}
      MONGODB_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME:?Set Mongo username}:${MONGO_INITDB_ROOT_PASSWORD:?Set Mongo password}@mongo:27017/${MONGODB_DB:-dino_games}?authSource=admin
      MONGODB_DB: ${MONGODB_DB:-dino_games}
      SESSION_SECRET: ${SESSION_SECRET:?Set session secret}
      TRUST_PROXY: 'true'
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 40s

  mongo:
    <<: *service
    image: mongo:7
    command: [mongod, --auth, --wiredTigerCacheSizeGB, '0.5']
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:?Set Mongo username}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?Set Mongo password}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        [
          CMD-SHELL,
          'mongosh --quiet --host 127.0.0.1 -u "$$MONGO_INITDB_ROOT_USERNAME" -p "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --eval "db.adminCommand({ ping: 1 })"',
        ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 40s

  proxy:
    <<: *service
    image: caddy:2-alpine
    depends_on:
      app:
        condition: service_healthy
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:2019/config/']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  mongo-data:
  caddy-data:
  caddy-config:

configs:
  caddyfile:
    content: |
      {
        email ${ACME_EMAIL:?Set certificate email}
      }
      ${PUBLIC_DOMAIN:-brunocastelo.me} {
        reverse_proxy app:3000 {
          header_up X-Real-IP {remote_host}
        }
        header X-Robots-Tag "noindex, nofollow"
      }
