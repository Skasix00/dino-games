# Include INSIDE the existing NCN nginx.conf.template's http block.
server {
    listen 80;
    listen [::]:80;
    server_name bruno.castelo.net;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://bruno.castelo.net$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name bruno.castelo.net;
    server_tokens off;
    client_max_body_size 8k;

    ssl_certificate /etc/letsencrypt/live/bruno.castelo.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bruno.castelo.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Docker DNS resolution on each TTL avoids stale upstream IPs after updates.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $dino_upstream http://dino-games-app:3000;

    location / {
        proxy_pass $dino_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
}
