# Include INSIDE the existing NCN nginx.conf.template's http block.
# Bootstrap configuration: obtain the new certificate before installing TLS config.
server {
    listen 80;
    listen [::]:80;
    server_name bruno.castelo.net;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 503;
    }
}
